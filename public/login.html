<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BookingKaKa.store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            max-width: 400px;
            width: 100%;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            background: white;
            margin-bottom: 2rem;
        }
    </style>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>

    <div class="login-card">
        <h3 class="text-center mb-4">Login</h3>
        <div id="alertMessage" class="alert alert-danger d-none"></div>
        
        <form id="loginForm">
            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            
            <!-- Cloudflare Turnstile Widget -->
            <div class="mb-3 d-flex justify-content-center">
                <div class="cf-turnstile" data-sitekey="1x00000000000000000000AA" data-callback="onTurnstileSuccess"></div>
            </div>

            <button type="submit" class="btn btn-primary w-100" id="loginBtn" disabled>Login</button>
        </form>
        
        <div class="mt-3 text-center">
            <p>Don't have an account? <a href="/register.html">Register here</a></p>
            <p><a href="/">Back to Home</a></p>
        </div>
    </div>

    <footer class="text-muted text-center py-3">
        <small>Copyright 2025, Tan Kok Feng & Wong Wen Ru</small>
    </footer>

    <script>
        // Enable button when Turnstile is solved
        function onTurnstileSuccess(token) {
            document.getElementById('loginBtn').disabled = false;
        }
    </script>
    <script src="/js/auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('alertMessage');
            const turnstileToken = turnstile.getResponse();

            if (!turnstileToken) {
                alertBox.textContent = 'Please complete the security check.';
                alertBox.classList.remove('d-none');
                return;
            }

            const result = await auth.login(email, password, turnstileToken);

            if (result.success) {
                window.location.href = '/';
            } else {
                alertBox.textContent = result.message;
                alertBox.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
