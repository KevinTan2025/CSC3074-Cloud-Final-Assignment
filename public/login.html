<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BookingKaKa.store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            max-width: 400px;
            width: 100%;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            background: white;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>

    <!-- Centered login card used for authentication -->
    <div class="login-card" role="main">
        <h3 class="text-center mb-4">Login</h3>
        <!-- alertMessage displays errors from authentication attempts. Initially hidden. -->
        <div id="alertMessage" class="alert alert-danger d-none" role="alert" aria-live="polite"></div>
        
        <form id="loginForm">
            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            
            <!-- Cloudflare Turnstile Widget: the widget is rendered by the external script. -->
                <div id="turnstile-container" class="mb-3 d-flex justify-content-center" aria-hidden="false"></div>

            <button type="submit" class="btn btn-primary w-100" id="loginBtn" disabled>Login</button>
        </form>
        
        <div class="mt-3 text-center">
            <p>Don't have an account? <a href="/register.html">Register here</a></p>
            <p><a href="/">Back to Home</a></p>
        </div>
    </div>

    <footer class="text-muted text-center py-3">
        <small>Copyright 2025, Tan Kok Feng & Wong Wen Ru</small>
    </footer>

    <script>
        // Called by Turnstile when the challenge is solved. Enables the login button.
        function onTurnstileSuccess(token) {
            const btn = document.getElementById('loginBtn');
            if (btn) btn.disabled = false;
        }

        // Fetch the site key from the server and render the Turnstile widget.
        // Keeps the site key out of the client build and allows different environments.
        window.onloadTurnstileCallback = async function() {
            try {
                const response = await fetch('/api/auth/config');
                if (!response.ok) {
                    console.error('Failed to load Turnstile config');
                    return;
                }
                const data = await response.json();

                // Render widget; the external Turnstile script will call onTurnstileSuccess on success.
                if (window.turnstile && typeof window.turnstile.render === 'function') {
                    turnstile.render('#turnstile-container', {
                        sitekey: data.siteKey,
                        callback: onTurnstileSuccess
                    });
                }
            } catch (error) {
                console.error('Error loading Turnstile config:', error);
            }
        };
    </script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onloadTurnstileCallback" async defer></script>
    <script src="/js/auth.js"></script>
    <script>
        // Login form submit handler. Uses `auth.login` from /js/auth.js.
        (function() {
            const form = document.getElementById('loginForm');
            const alertBox = document.getElementById('alertMessage');
            const loginBtn = document.getElementById('loginBtn');

            if (!form) return;

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                // Safely check if the Turnstile API is present and get the response token.
                let turnstileToken = null;
                try {
                    if (window.turnstile && typeof turnstile.getResponse === 'function') {
                        turnstileToken = turnstile.getResponse();
                    }
                } catch (err) {
                    console.warn('Turnstile unavailable:', err);
                }

                if (!turnstileToken) {
                    alertBox.textContent = 'Please complete the security check.';
                    alertBox.classList.remove('d-none');
                    return;
                }

                // Disable the button to prevent double submits until the request finishes.
                if (loginBtn) loginBtn.disabled = true;

                try {
                    const result = await auth.login(email, password, turnstileToken);
                    if (result && result.success) {
                        window.location.href = '/';
                    } else {
                        alertBox.textContent = (result && result.message) ? result.message : 'Login failed';
                        alertBox.classList.remove('d-none');
                    }
                } catch (err) {
                    console.error('Login error:', err);
                    alertBox.textContent = 'Network error. Please try again.';
                    alertBox.classList.remove('d-none');
                } finally {
                    if (loginBtn) loginBtn.disabled = false;
                }
            });
        })();
    </script>
</body>
</html>
